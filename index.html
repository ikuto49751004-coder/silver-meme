<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>準備完了チェック</title>
  <style>
    /* 全体・背景設定（さわやかな水色グラデーション） */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
      font-family: sans-serif;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* メインの白いカード（見やすさアップ） */
    .card {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      color: #0284c7;
    }

    /* チェックボックスリスト */
    .checklist {
      text-align: left;
      margin: 1.5rem 0;
    }

    .check-item {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 1rem;
      cursor: pointer;
    }

    .check-item input {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
    }

    /* アニメーション用設定 */
    .hidden {
      display: none;
      opacity: 0;
      transform: translateY(10px);
    }

    .visible {
      display: inline-block;
      opacity: 1;
      transform: translateY(0);
      transition: all 0.4s ease-out;
    }

    /* スタートボタン（水色に映えるオレンジ） */
    .start-btn {
      background-color: #f97316;
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: bold;
      border: none;
      padding: 12px 32px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.4);
      margin-top: 1rem;
    }

    .start-btn:hover {
      background-color: #ea580c;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>準備を完了させてね！</h2>

    <!-- 必須項目リスト -->
    <div class="checklist">
      <label class="check-item">
        <input type="checkbox" class="required-check">
        <span>必須項目 1 を確認した</span>
      </label>
      <label class="check-item">
        <input type="checkbox" class="required-check">
        <span>必須項目 2 を確認した</span>
      </label>
      <label class="check-item">
        <input type="checkbox" class="required-check">
        <span>必須項目 3 を確認した</span>
      </label>
    </div>

    <!-- 条件クリアで現れるスタートボタン -->
    <button id="startBtn" class="start-btn hidden" onclick="alert('スタートしました！')">
      準備OK！スタート
    </button>
  </div>

  <script>
    // 必須のチェックボックスとスタートボタンを取得
    const checkboxes = document.querySelectorAll('.required-check');
    const startBtn = document.getElementById('startBtn');

    // チェック状態を判定する関数
    function checkStatus() {
      // すべてのチェックボックスが checked か判定
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);

      if (allChecked) {
        startBtn.classList.remove('hidden');
        startBtn.classList.add('visible');
      } else {
        startBtn.classList.remove('visible');
        startBtn.classList.add('hidden');
      }
    }

    // 全てのチェックボックスにイベントを設定
    checkboxes.forEach(cb => {
      cb.addEventListener('change', checkStatus);
    });
  </script>

</body>
</html>
